<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cogita Knowledge theme: connect content sources</title>
  <desc id="desc">The Knowledge theme connects Git and JSON content to a unified searchable index with traceable links.</desc>
  <rect width="1200" height="630" fill="#f7fbf8"/>
  <circle cx="1060" cy="82" r="240" fill="#e4f2ea"/>
  <circle cx="1150" cy="570" r="200" fill="#dcefe6"/>
  <text x="78" y="104" fill="#2e7657" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4">KNOWLEDGE THEME</text>
  <text x="78" y="182" fill="#214f3d" font-family="Arial, sans-serif" font-size="54" font-weight="700">Connect content.</text>
  <text x="78" y="246" fill="#214f3d" font-family="Arial, sans-serif" font-size="54" font-weight="700">Keep the trail.</text>
  <text x="78" y="302" fill="#577466" font-family="Arial, sans-serif" font-size="24">Git checkouts and JSON exports flow into one</text>
  <text x="78" y="338" fill="#577466" font-family="Arial, sans-serif" font-size="24">searchable index—with topics and backlinks.</text>
  <rect x="78" y="430" width="230" height="112" rx="24" fill="#2e7657"/>
  <text x="193" y="480" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Git</text>
  <text x="193" y="516" fill="#d9f0e3" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">source</text>
  <rect x="485" y="430" width="230" height="112" rx="24" fill="#e1f0e8" stroke="#2e7657" stroke-width="3"/>
  <text x="600" y="480" fill="#214f3d" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">ContentIndex</text>
  <text x="600" y="516" fill="#577466" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">search · topics · links</text>
  <rect x="892" y="430" width="230" height="112" rx="24" fill="#214f3d"/>
  <text x="1007" y="480" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Theme</text>
  <text x="1007" y="516" fill="#d9f0e3" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">experience</text>
  <path d="M326 486h126M733 486h126" stroke="#2e7657" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 14"/>
</svg>
