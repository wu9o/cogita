name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # This is important for changeset to be able to create tags
          fetch-depth: 0

      - name: Checkout external blog consumer
        uses: actions/checkout@v4
        with:
          repository: wu9o/cogita-blog
          path: cogita-blog
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify package consumer boundaries
        run: pnpm run check:release
        env:
          COGITA_BLOG_DIR: ${{ github.workspace }}/cogita-blog
          COGITA_REQUIRE_EXTERNAL_BLOG: 'true'

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published registry consumer
        if: steps.changesets.outputs.published == 'true'
        run: pnpm run check:registry-consumer -- --require-doctor
