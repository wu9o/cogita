name: 部署 Cogita 使用手册

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码质量检查
        run: |
          pnpm run check
          pnpm run lint

      - name: 构建工作区包
        run: pnpm run build:packages

      - name: 部署前站点自检
        run: pnpm --filter docs-site exec cogita doctor --strict --json

      - name: 构建使用手册
        run: pnpm --filter docs-site build

      - name: 构建主题 Demo
        run: pnpm run build:demos
        env:
          COGITA_DEMO_PREFIX: /cogita

      - name: 合并主题 Demo 到 Pages 产物
        run: node scripts/stage-pages.mjs

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传文档站构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/doc_build

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
